baseURL = "https://daniloarantes.com.br/"
locale = "pt-BR"
title = "Danilo Arantes"
publishDir = "public"

[markup]
  [markup.highlight]
    codeFences = true
    style = "pygments"
  [markup.goldmark.renderer]
    # permite HTML bruto (ex.: <br>) dentro dos arquivos Markdown
    unsafe = true

[params]
  dateFormat = "Jan 2, 2006"
  homeText = "Blog - Danilo Arantes"

[menu]
  [[menu.main]]
    name = "Blog"
    pre = "edit"
    url = "/post/"
    weight = 1
  [[menu.main]]
    name = "Tags"
    pre = "tag"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    name = "Sobre"
    pre = "user"
    url = "/sobre/"
    weight = 3

[taxonomies]
  tag = "tags"
