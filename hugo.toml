baseURL = "https://daniloarantes.com.br/"
locale = "pt-BR"
title = "Danilo Arantes"
publishDir = "public"

[markup]
  [markup.highlight]
    codeFences = true
    style = "github-dark"
  [markup.goldmark.renderer]
    # permite HTML bruto (ex.: <br>) dentro dos arquivos Markdown
    unsafe = true

[params]
  homeText = "Linux, redes e código explicados sem complicação. Aulas, tutoriais e anotações de Danilo Arantes."
  twitter = "daniloarantes"
  youtube = "https://www.youtube.com/watch?v=tEYL9-DU60g"

  # Categorias dos posts (campo "categoria"), na ordem dos filtros, com o matiz oklch da cor
  categorias = [
    { nome = "Linux", matiz = 150 },
    { nome = "Redes", matiz = 255 },
    { nome = "Servidores", matiz = 305 },
    { nome = "Docker", matiz = 220 },
    { nome = "Fundamentos", matiz = 55 },
  ]

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/post/"
    weight = 1
  [[menu.main]]
    name = "Aulas"
    url = "/#serie"
    weight = 2
  [[menu.main]]
    name = "Livro"
    url = "/livro/"
    weight = 3
  [[menu.main]]
    name = "Sobre"
    url = "/sobre/"
    weight = 4

[taxonomies]
  tag = "tags"
