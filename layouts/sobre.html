{{ define "main" }}
<article class="artigo artigo-sobre">
  <header class="sobre-hero">
    <div class="sobre-hero-texto">
      <span class="kicker" style="--h:305">{{ .Params.kicker | default "Sobre" }}</span>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="hero-sub">{{ . }}</p>{{ end }}
    </div>
    {{ partial "foto.html" (dict "src" "imagens/danilo-web-summit-rio-2024.jpg" "largura" 460 "altura" 506 "alt" "Danilo Arantes no Web Summit Rio 2024") }}
  </header>
  <div class="prosa">
    {{ .Content }}
  </div>
</article>
{{ end }}
